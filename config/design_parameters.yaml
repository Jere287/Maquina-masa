# =============================================================================
# BASE DE DATOS DE PARAMETROS DE DISENO
# Proyecto: Rediseno de mezcladora de porcelana fria  ·  P1 -> P2
# =============================================================================
#
# FUENTE UNICA DE VERDAD. Ningun script debe llevar valores numericos dentro:
# todos se leen de aqui.
#
# ESQUEMA. Cada parametro es un mapa con:
#   value  : el valor, o UNKNOWN si aun no se conoce
#   unit   : unidad SI o la indicada
#   source : procedencia -> OBSERVADO | MEDIDO | PROPORCIONADO | CALCULADO
#                           SUPUESTO | PENDIENTE
#   ref    : ID de la medida en docs/measurement_plan.md, o referencia
#   notes  : aclaracion breve
#
# REGLA. Ningun parametro con source PENDIENTE o SUPUESTO puede usarse para
# cerrar un plano de taller. Los scripts deben marcarlo en sus resultados.
#
# Estado: FASE 1 - practicamente todo PENDIENTE, como corresponde.
# =============================================================================

meta:
  proyecto: "Mezcladora de porcelana fria"
  ubicacion: "Quito, Ecuador"
  fase_actual: 1
  fecha_actualizacion: "2026-09-03"
  baseline: "Prototipo 1 fisico (fotografias 2026-09-02)"

# -----------------------------------------------------------------------------
# 1. PROCESO Y PRODUCTO
# -----------------------------------------------------------------------------
proceso:
  receta:
    value: "3 tazas cola vinilica + 6 tazas maicena + 2 cda glicerina + 1 cda vaselina + 1 cdta vinagre + 3x2.5 ml benzoato"
    unit: "-"
    source: PROPORCIONADO
    notes: "Receta base del proceso artesanal"

  metodo_actual:
    value: "microondas en ciclos de 2 min, meneando entre ciclos"
    unit: "-"
    source: PROPORCIONADO
    notes: "Proceso artesanal, NO el de la maquina P1"

  lotes_paralelos_microondas:
    value: 6
    unit: "recipientes"
    source: PROPORCIONADO

  masa_mezcla_por_recipiente:
    value: 6.0
    unit: kg
    source: PROPORCIONADO
    notes: "Aproximado, del proceso de microondas"

  rendimiento_masa_total:
    value: 12.0
    unit: kg
    source: PROPORCIONADO
    notes: "Producto terminado a partir de los 6 recipientes"

producto:
  densidad:
    value: UNKNOWN
    unit: kg/m3
    source: PENDIENTE
    ref: PRO-08
    notes: "Pesar 1 litro de masa terminada. Antes se asumio 1150; sin verificar"

  viscosidad_aparente:
    value: UNKNOWN
    unit: Pa.s
    source: PENDIENTE
    notes: "No medible con instrumentos simples. Se inferira del par medido PAR-03/PAR-06"

  temperatura_cuaje:
    value: UNKNOWN
    unit: degC
    source: PENDIENTE
    ref: PRO-05
    notes: "CRITICO. Antes se asumio 72 degC. Nunca verificado. Condiciona todo el diseno termico"

  temperatura_inicial:
    value: UNKNOWN
    unit: degC
    source: PENDIENTE
    notes: "Temperatura ambiente de Quito al cargar"

  umbral_costra:
    value: 120.0
    unit: degC
    source: SUPUESTO
    notes: "Valor tipico de pardeamiento en pastas de almidon. No medido en esta receta"

  conductividad_termica:
